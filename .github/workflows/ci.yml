name: paymenthandler

on:
  push:
    branches: [ main, develop ] 
  pull_request:
    branches: [ main ]  

jobs:
  build-and-test:
    name: Build and Test 
    runs-on: ubuntu-latest 
    steps: 
    - name: Checkout code #downloads code from git
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'  
        cache: maven  # Caching Maven dependencies to speed up builds

    - name: Build with Maven
      run: mvn clean compile

    - name: Run tests
      run: mvn test

    # creates war file by package
    - name: Package application
      run: mvn package -DskipTests

    - name: Upload WAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: paymenthandler-war
        path: target/paymenthandler.war
        retention-days: 7  # artifact will be for 7 days

    - name: Build Summary
      run: |
        echo "✅ Build completed successfully!"
        echo "📦 WAR file created: target/paymenthandler.war"
        ls -lh target/paymenthandler.war
